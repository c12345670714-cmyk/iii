<!DOCTYPE html>

<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>帳號管理</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700&display=swap');

:root {
–accent:#E91E8C;–accent2:#f06292;
–accent-soft:rgba(233,30,140,0.10);–accent-mid:rgba(233,30,140,0.22);
–glass:rgba(255,255,255,0.55);–glass-border:rgba(255,255,255,0.72);
–glass-card:rgba(255,255,255,0.50);–card-border:rgba(255,255,255,0.68);
–shadow:0 8px 32px rgba(0,0,0,0.08);
–text:#1e1228;–text-sub:#9e6b8a;
–tab-bg:rgba(255,255,255,0.72);
–input-bg:rgba(255,255,255,0.80);–input-border:rgba(233,30,140,0.15);
–divider:rgba(233,30,140,0.07);–toggle-off:#d0d0d8;
–bg:radial-gradient(ellipse at 20% 10%,#fbc8da 0%,#f0b8cc 30%,#e8d0e8 60%,#f8e8f0 100%);
}
[data-mode=“dark”]{
–glass:rgba(30,12,25,0.60);–glass-border:rgba(255,255,255,0.10);
–glass-card:rgba(25,10,20,0.55);–card-border:rgba(255,255,255,0.08);
–shadow:0 8px 32px rgba(0,0,0,0.38);
–text:#f0dce8;–text-sub:#a07090;
–tab-bg:rgba(20,8,18,0.82);
–input-bg:rgba(35,12,28,0.82);–input-border:rgba(233,30,140,0.25);
–divider:rgba(233,30,140,0.10);–toggle-off:#444;
–accent-soft:rgba(233,30,140,0.15);–accent-mid:rgba(233,30,140,0.28);
–bg:radial-gradient(ellipse at 20% 10%,#1a0a14 0%,#200d1a 35%,#150d22 65%,#0e0e1a 100%);
}
[data-theme=“Default”]{–accent:#3b82f6;–accent2:#60a5fa;}
[data-theme=“Rose”]{–accent:#e11d48;–accent2:#fb7185;}
[data-theme=“Pink”]{–accent:#E91E8C;–accent2:#f06292;}
[data-theme=“Violet”]{–accent:#7c3aed;–accent2:#a78bfa;}
[data-theme=“Purple”]{–accent:#9333ea;–accent2:#c084fc;}
[data-theme=“Indigo”]{–accent:#4338ca;–accent2:#818cf8;}
[data-theme=“Sky”]{–accent:#0284c7;–accent2:#38bdf8;}
[data-theme=“Cyan”]{–accent:#0891b2;–accent2:#22d3ee;}
[data-theme=“Teal”]{–accent:#0d9488;–accent2:#2dd4bf;}
[data-theme=“Emerald”]{–accent:#059669;–accent2:#34d399;}
[data-theme=“Green”]{–accent:#16a34a;–accent2:#4ade80;}
[data-theme=“Orange”]{–accent:#ea580c;–accent2:#fb923c;}
[data-theme=“Red”]{–accent:#dc2626;–accent2:#f87171;}
[data-theme=“Neutral”]{–accent:#525252;–accent2:#a3a3a3;}
[data-theme=“Slate”]{–accent:#475569;–accent2:#94a3b8;}
[data-theme=“Yellow”]{–accent:#ca8a04;–accent2:#facc15;}

*{box-sizing:border-box;margin:0;padding:0;}
body{
font-family:‘Noto Sans TC’,sans-serif;min-height:100vh;
background:var(–bg);color:var(–text);
transition:background 1.4s ease,color 0.4s;overflow-x:hidden;
}
.bg-blob{
position:fixed;border-radius:50%;filter:blur(72px);pointer-events:none;z-index:0;
animation:blobFloat 9s ease-in-out infinite;transition:background 1.4s;
}
.b1{width:420px;height:420px;background:var(–accent);top:-120px;left:-100px;opacity:.20;animation-delay:0s;}
.b2{width:320px;height:320px;background:var(–accent2);top:38%;right:-80px;opacity:.16;animation-delay:3s;}
.b3{width:260px;height:260px;background:var(–accent);bottom:12%;left:18%;opacity:.13;animation-delay:5.5s;}
[data-mode=“dark”] .b1{opacity:.28;}[data-mode=“dark”] .b2{opacity:.22;}[data-mode=“dark”] .b3{opacity:.18;}
@keyframes blobFloat{0%,100%{transform:translateY(0) scale(1);}50%{transform:translateY(-22px) scale(1.04);}}

.wrap{position:relative;z-index:1;max-width:680px;margin:0 auto;padding:32px 16px 100px;}

/* HEADER */
.hdr{display:flex;align-items:center;justify-content:space-between;margin-bottom:22px;}
.hdr h1{font-size:25px;font-weight:700;}
.badge{display:inline-block;background:var(–accent-soft);color:var(–accent);border-radius:20px;padding:2px 10px;font-size:12px;font-weight:600;margin-left:8px;transition:background .3s,color .3s;}
.hdr-right{display:flex;gap:8px;align-items:center;}
.dn-chip{display:flex;align-items:center;gap:4px;background:var(–accent-soft);color:var(–accent);border-radius:20px;padding:5px 11px;font-size:11px;font-weight:600;transition:background .3s;}
.icon-btn{width:43px;height:43px;border-radius:14px;background:var(–glass);border:1.5px solid var(–glass-border);backdrop-filter:blur(12px);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .2s;color:var(–accent);}
.icon-btn:hover{background:var(–accent-soft);transform:scale(1.07);}
.icon-btn svg{width:18px;height:18px;}

/* SEARCH */
.srch-wrap{position:relative;margin-bottom:18px;}
.srch{width:100%;padding:13px 18px 13px 43px;border-radius:16px;background:var(–glass);border:1.5px solid var(–glass-border);backdrop-filter:blur(14px);font-size:15px;font-family:inherit;color:var(–text);outline:none;box-shadow:var(–shadow);transition:border .2s,background .4s;}
.srch::placeholder{color:var(–text-sub);}
.srch:focus{border-color:var(–accent);box-shadow:0 0 0 3px var(–accent-soft);}
.srch-ic{position:absolute;left:14px;top:50%;transform:translateY(-50%);color:var(–accent);pointer-events:none;}

.sec-lbl{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(–text-sub);margin:18px 0 9px 4px;}
.cards{display:flex;flex-direction:column;gap:11px;}

/* CARD */
.card{background:var(–glass-card);border:1.5px solid var(–card-border);backdrop-filter:blur(18px);border-radius:20px;overflow:hidden;box-shadow:var(–shadow);transition:box-shadow .2s,transform .2s,background .4s,border .4s;animation:cIn .4s cubic-bezier(.22,1,.36,1) both;}
.card:hover{box-shadow:0 14px 44px rgba(0,0,0,0.13);transform:translateY(-2px);}
@keyframes cIn{from{opacity:0;transform:translateY(14px);}to{opacity:1;transform:translateY(0);}}
.card-hdr{display:flex;align-items:center;justify-content:space-between;padding:14px 17px;cursor:pointer;user-select:none;}
.card-hdr-l{display:flex;align-items:center;gap:11px;}
.cflag{font-size:25px;line-height:1;}
.cname{font-size:15px;font-weight:600;}
.csub{font-size:11px;color:var(–text-sub);margin-top:2px;}
.card-hdr-r{display:flex;align-items:center;gap:6px;}
.tbadge{font-size:10px;padding:3px 9px;border-radius:20px;font-weight:600;border:1.5px solid;}
.tbadge.a{background:var(–accent-soft);color:var(–accent);border-color:var(–accent-mid);}
.tbadge.n{background:rgba(14,165,233,.10);color:#0ea5e9;border-color:rgba(14,165,233,.20);}
[data-mode=“dark”] .tbadge.n{background:rgba(14,165,233,.15);border-color:rgba(14,165,233,.30);}
.cpbtn{font-size:11px;padding:4px 9px;border-radius:20px;background:var(–accent-soft);color:var(–accent);border:none;cursor:pointer;font-family:inherit;font-weight:500;transition:background .15s;}
.cpbtn:hover{background:var(–accent-mid);}
.chev{color:var(–text-sub);transition:transform .3s;flex-shrink:0;}
.card.open .chev{transform:rotate(180deg);}
.cbody{display:none;padding:0 17px 15px;border-top:1px solid var(–divider);}
.card.open .cbody{display:block;}
.frow{display:flex;align-items:center;gap:9px;padding:9px 0;border-bottom:1px solid var(–divider);}
.frow:last-child{border-bottom:none;}
.flbl{font-size:12px;color:var(–text-sub);width:44px;flex-shrink:0;font-weight:500;}
.fval{flex:1;font-size:13px;font-weight:500;word-break:break-all;font-family:‘SF Mono’,‘Fira Code’,monospace;}
.fval.mask{letter-spacing:3px;color:var(–text-sub);}
.facts{display:flex;gap:5px;flex-shrink:0;}
.mb{width:27px;height:27px;border-radius:8px;border:none;display:flex;align-items:center;justify-content:center;cursor:pointer;transition:all .15s;background:var(–accent-soft);color:var(–accent);}
.mb:hover{background:var(–accent-mid);transform:scale(1.1);}
.mb svg{width:13px;height:13px;}
.cerow{padding-top:10px;margin-top:4px;border-top:1px solid var(–divider);}
.erb{display:flex;gap:7px;}
.rbtn{display:flex;align-items:center;gap:4px;padding:5px 12px;border-radius:10px;border:none;font-size:12px;font-family:inherit;font-weight:500;cursor:pointer;transition:all .15s;background:var(–accent-soft);color:var(–accent);}
.rbtn:hover{background:var(–accent-mid);}
.rbtn.del{background:rgba(239,68,68,.10);color:#dc2626;}
.rbtn.del:hover{background:rgba(239,68,68,.20);}
.rbtn svg{width:12px;height:12px;}

.add-card{background:linear-gradient(135deg,var(–accent-soft),rgba(255,255,255,.04));border:2px dashed var(–accent-mid);border-radius:20px;padding:17px;cursor:pointer;text-align:center;color:var(–accent);font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:8px;transition:all .2s;margin-top:12px;}
.add-card:hover{background:var(–accent-soft);border-color:var(–accent);}
.empty{text-align:center;padding:34px 20px;color:var(–text-sub);font-size:13px;}

/* TAB BAR */
.tabbar{position:fixed;bottom:0;left:0;right:0;z-index:50;display:flex;justify-content:center;padding:10px 20px 20px;}
.tabbar-in{background:var(–tab-bg);backdrop-filter:blur(20px);border-radius:30px;border:1.5px solid var(–glass-border);padding:8px 28px;display:flex;gap:22px;align-items:center;box-shadow:0 4px 24px rgba(0,0,0,0.12);transition:background .4s,border .4s;}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;opacity:.38;transition:opacity .2s,color .2s;font-size:10px;color:var(–text);font-weight:500;padding:4px 5px;border-radius:10px;}
.tab.on{opacity:1;color:var(–accent);}
.tab svg{width:20px;height:20px;}
.tab-ctr{width:45px;height:45px;border-radius:50%;background:linear-gradient(135deg,var(–accent),var(–accent2));display:flex;align-items:center;justify-content:center;box-shadow:0 4px 16px var(–accent-mid);cursor:pointer;transition:transform .2s;}
.tab-ctr:hover{transform:scale(1.08);}

/* PAGES */
.page{display:none;animation:pIn .28s cubic-bezier(.22,1,.36,1);}
.page.on{display:block;}
@keyframes pIn{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}

/* SETTINGS */
.shdr{display:flex;align-items:center;gap:12px;margin-bottom:24px;}
.back{width:40px;height:40px;border-radius:13px;background:var(–glass);border:1.5px solid var(–glass-border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(–accent);transition:all .2s;}
.back:hover{background:var(–accent-soft);}
.back svg{width:18px;height:18px;}
.stitle{font-size:18px;font-weight:700;}
.scard{background:var(–glass-card);border:1.5px solid var(–card-border);backdrop-filter:blur(18px);border-radius:20px;overflow:hidden;box-shadow:var(–shadow);margin-bottom:13px;transition:background .4s,border .4s;}
.srow{display:flex;align-items:center;gap:13px;padding:14px 17px;border-bottom:1px solid var(–divider);cursor:pointer;transition:background .15s;}
.srow:last-child{border-bottom:none;}
.srow:hover{background:var(–accent-soft);}
.srow-ic{width:34px;height:34px;border-radius:10px;background:var(–accent-soft);display:flex;align-items:center;justify-content:center;flex-shrink:0;color:var(–accent);}
.srow-ic svg{width:16px;height:16px;}
.srow-lbl{flex:1;font-size:14px;font-weight:500;}
.srow-r{display:flex;align-items:center;gap:7px;color:var(–text-sub);font-size:13px;}
.tog{width:47px;height:27px;border-radius:14px;background:var(–toggle-off);position:relative;cursor:pointer;transition:background .25s;flex-shrink:0;}
.tog.on{background:var(–accent);}
.tog::after{content:’’;position:absolute;width:21px;height:21px;border-radius:50%;background:#fff;top:3px;left:3px;transition:transform .25s cubic-bezier(.22,1,.36,1);box-shadow:0 1px 4px rgba(0,0,0,.18);}
.tog.on::after{transform:translateX(20px);}
.tdot{width:21px;height:21px;border-radius:50%;background:var(–accent);flex-shrink:0;box-shadow:0 2px 8px var(–accent-mid);}

/* COLOR GRID */
.cgrid{display:grid;grid-template-columns:repeat(5,1fr);gap:11px;padding:15px;}
.cc{aspect-ratio:1;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;transition:transform .18s,box-shadow .18s;box-shadow:0 2px 8px rgba(0,0,0,.15);position:relative;text-shadow:0 1px 2px rgba(0,0,0,.3);}
.cc:hover{transform:scale(1.12);}
.cc.sel::before{content:‘✓’;position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:15px;font-weight:900;background:rgba(0,0,0,.15);border-radius:50%;}
.cc-ring{position:absolute;inset:-4px;border-radius:50%;border:3px solid var(–accent);opacity:0;transition:opacity .2s;}
.cc.sel .cc-ring{opacity:1;}

.mode-info{background:var(–accent-soft);border-radius:14px;padding:11px 15px;display:flex;align-items:flex-start;gap:9px;color:var(–text-sub);font-size:12px;line-height:1.6;margin-bottom:13px;}
.mode-info svg{width:17px;height:17px;color:var(–accent);flex-shrink:0;margin-top:1px;}

/* MODAL */
.moverlay{display:none;position:fixed;inset:0;z-index:100;background:rgba(10,5,12,.42);backdrop-filter:blur(8px);align-items:flex-end;justify-content:center;}
.moverlay.on{display:flex;animation:fadeIn .2s;}
@keyframes fadeIn{from{opacity:0;}to{opacity:1;}}
.modal{background:var(–input-bg);backdrop-filter:blur(24px);border-radius:28px 28px 0 0;padding:26px 20px 36px;width:100%;max-width:600px;box-shadow:0 -8px 40px rgba(0,0,0,.18);border:1.5px solid var(–glass-border);border-bottom:none;animation:mUp .3s cubic-bezier(.22,1,.36,1);transition:background .4s,border .4s;max-height:92vh;overflow-y:auto;}
@keyframes mUp{from{transform:translateY(80px);opacity:0;}to{transform:translateY(0);opacity:1;}}
.mhandle{width:38px;height:4px;border-radius:4px;background:var(–divider);margin:0 auto 18px;}
.modal h2{font-size:17px;font-weight:700;margin-bottom:16px;}
.tsel{display:flex;gap:7px;margin-bottom:14px;}
.tsbtn{flex:1;padding:10px;border-radius:13px;border:1.5px solid var(–input-border);background:var(–input-bg);font-size:13px;font-family:inherit;font-weight:600;cursor:pointer;transition:all .15s;color:var(–text-sub);text-align:center;}
.tsbtn.on{border-color:var(–accent);background:var(–accent-soft);color:var(–accent);}
.ff{margin-bottom:11px;}
.ff label{display:block;font-size:11px;font-weight:700;color:var(–text-sub);margin-bottom:5px;letter-spacing:.06em;text-transform:uppercase;}
.ff input,.ff textarea{width:100%;padding:11px 13px;border-radius:12px;border:1.5px solid var(–input-border);background:var(–input-bg);font-size:14px;font-family:inherit;color:var(–text);outline:none;transition:border .2s,background .4s;}
.ff textarea{resize:vertical;min-height:66px;line-height:1.5;}
.ff input:focus,.ff textarea:focus{border-color:var(–accent);box-shadow:0 0 0 3px var(–accent-soft);}
.macts{display:flex;gap:7px;margin-top:16px;}
.bcnl{flex:1;padding:13px;border-radius:14px;border:1.5px solid var(–input-border);background:transparent;color:var(–text-sub);font-size:14px;font-family:inherit;cursor:pointer;transition:all .15s;font-weight:500;}
.bcnl:hover{background:var(–accent-soft);}
.bsave{flex:2;padding:13px;border-radius:14px;border:none;background:linear-gradient(135deg,var(–accent),var(–accent2));color:#fff;font-size:14px;font-family:inherit;cursor:pointer;transition:all .15s;font-weight:600;box-shadow:0 4px 16px var(–accent-mid);}
.bsave:hover{transform:translateY(-1px);}
.bdel{padding:13px 15px;border-radius:14px;border:none;background:rgba(239,68,68,.10);color:#dc2626;font-size:14px;font-family:inherit;cursor:pointer;font-weight:500;transition:all .15s;}
.bdel:hover{background:rgba(239,68,68,.20);}

.aff{display:none;}.aff.on{display:block;}
.nff{display:none;}.nff.on{display:block;}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(60px);background:rgba(15,8,18,.88);color:#fff;padding:10px 22px;border-radius:30px;font-size:13px;font-weight:500;z-index:300;transition:transform .3s cubic-bezier(.22,1,.36,1),opacity .3s;opacity:0;white-space:nowrap;backdrop-filter:blur(10px);}
.toast.on{transform:translateX(-50%) translateY(0);opacity:1;}
@media(max-width:440px){.wrap{padding:24px 12px 100px;}.cgrid{grid-template-columns:repeat(4,1fr);}}
</style>

</head>
<body data-theme="Pink" data-mode="light">
<div class="bg-blob b1"></div>
<div class="bg-blob b2"></div>
<div class="bg-blob b3"></div>

<div class="wrap">

<!-- ===== MAIN PAGE ===== -->

<div id="pMain" class="page on">
  <div class="hdr">
    <h1>帳號管理<span class="badge" id="badge">0</span></h1>
    <div class="hdr-right">
      <div class="dn-chip" id="dnchip">☀️ 日間</div>
      <div class="icon-btn" onclick="goPage('pSettings')" title="設定">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      </div>
    </div>
  </div>
  <div class="srch-wrap">
    <span class="srch-ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg></span>
    <input type="text" class="srch" id="srch" placeholder="搜尋地區、帳號或節點…" oninput="render()">
  </div>
  <div id="appleSec"><div class="sec-lbl">🍎 Apple ID</div><div class="cards" id="appleList"></div></div>
  <div id="nodeSec"><div class="sec-lbl">🌐 節點</div><div class="cards" id="nodeList"></div></div>
  <div class="add-card" onclick="openAdd()">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    新增帳號 / 節點
  </div>
</div>

<!-- ===== SETTINGS PAGE ===== -->

<div id="pSettings" class="page">
  <div class="shdr">
    <div class="back" onclick="goPage('pMain')"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg></div>
    <span class="stitle">偏好設定</span>
  </div>

  <div class="scard">
    <div class="srow" onclick="toggleAuto()">
      <div class="srow-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></div>
      <span class="srow-lbl">根據日出日落自動切換</span>
      <div class="tog" id="togAuto"></div>
    </div>
    <div class="srow" id="darkRow" onclick="toggleDark()">
      <div class="srow-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.79A9 9 0 1 1 11.21 3a7 7 0 0 0 9.79 9.79z"/></svg></div>
      <span class="srow-lbl">深色模式</span>
      <div class="tog" id="togDark"></div>
    </div>
  </div>

  <div id="modeInfoBox" class="mode-info" style="display:none;">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
    <span id="modeInfoTxt"></span>
  </div>

  <div class="scard" id="themeCard">
    <div class="srow" onclick="toggleCGrid()">
      <div class="srow-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="13.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="10.5" r="2.5"/><circle cx="8.5" cy="7.5" r="2.5"/><circle cx="6.5" cy="12.5" r="2.5"/><path d="M12 2C6.5 2 2 6.5 2 12s4.5 10 10 10c.926 0 1.648-.746 1.648-1.688 0-.437-.18-.835-.437-1.125-.29-.289-.438-.652-.438-1.125a1.64 1.64 0 0 1 1.668-1.668h1.996c3.051 0 5.555-2.503 5.555-5.554C21.965 6.012 17.461 2 12 2z"/></svg></div>
      <span class="srow-lbl">主題顏色</span>
      <div class="srow-r">
        <div class="tdot" id="curDot"></div>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="15" height="15" id="cgChev"><polyline points="6 9 12 15 18 9"/></svg>
      </div>
    </div>
    <div id="cgWrap" style="display:none;"><div class="cgrid" id="cgrid"></div></div>
  </div>

  <div class="scard">
    <div class="srow" style="cursor:default;">
      <div class="srow-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></svg></div>
      <span class="srow-lbl">北京時間</span>
      <div class="srow-r" id="bjTime" style="font-family:monospace;">--:--:--</div>
    </div>
    <div class="srow" style="cursor:default;">
      <div class="srow-ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg></div>
      <span class="srow-lbl">日出 / 日落</span>
      <div class="srow-r">06:00 / 18:30</div>
    </div>
  </div>
</div>

</div><!-- /wrap -->

<!-- TAB BAR -->

<div class="tabbar">
  <div class="tabbar-in">
    <div class="tab on" id="tab0" onclick="goPage('pMain')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
      帳號
    </div>
    <div class="tab-ctr" onclick="openAdd()">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
    </div>
    <div class="tab" id="tab1" onclick="goPage('pSettings')">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l-.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      設定
    </div>
  </div>
</div>

<!-- MODAL -->

<div class="moverlay" id="moverlay">
  <div class="modal">
    <div class="mhandle"></div>
    <h2 id="mtitle">新增</h2>
    <div class="tsel">
      <button class="tsbtn on" id="btnA" onclick="selType('apple')">🍎 Apple ID</button>
      <button class="tsbtn" id="btnN" onclick="selType('node')">🌐 節點</button>
    </div>
    <div class="aff on" id="aff">
      <div class="ff"><label>地區名稱</label><input id="fReg" placeholder="例：美國、日本…"></div>
      <div class="ff"><label>旗幟 Emoji</label><input id="fFlg" placeholder="🇺🇸"></div>
      <div class="ff"><label>Apple ID（郵箱）</label><input type="email" id="fEml" placeholder="example@icloud.com"></div>
      <div class="ff"><label>密碼</label><input id="fPw" placeholder="輸入密碼"></div>
    </div>
    <div class="nff" id="nff">
      <div class="ff"><label>節點名稱</label><input id="fNN" placeholder="例：日本 Tokyo 01"></div>
      <div class="ff"><label>旗幟 Emoji</label><input id="fNF" placeholder="🇯🇵"></div>
      <div class="ff"><label>伺服器 / 位址</label><input id="fNS" placeholder="server.example.com 或 IP"></div>
      <div class="ff"><label>端口</label><input id="fNP" placeholder="443"></div>
      <div class="ff"><label>協議類型</label><input id="fNPr" placeholder="vmess / trojan / ss / vless…"></div>
      <div class="ff"><label>UUID / 密碼</label><input id="fNU" placeholder="UUID 或連接密碼"></div>
      <div class="ff"><label>備註 / 訂閱鏈接（選填）</label><textarea id="fNNote" placeholder="訂閱鏈接或其他備注…"></textarea></div>
    </div>
    <div class="macts" id="macts">
      <button class="bcnl" onclick="closeM()">取消</button>
      <button class="bsave" onclick="saveItem()">儲存</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const THEMES=[
  {n:'Default',c:'#3b82f6'},{n:'Rose',c:'#e11d48'},{n:'Pink',c:'#E91E8C'},
  {n:'Violet',c:'#7c3aed'},{n:'Purple',c:'#9333ea'},{n:'Indigo',c:'#4338ca'},
  {n:'Sky',c:'#0284c7'},{n:'Cyan',c:'#0891b2'},{n:'Teal',c:'#0d9488'},
  {n:'Emerald',c:'#059669'},{n:'Green',c:'#16a34a'},{n:'Orange',c:'#ea580c'},
  {n:'Red',c:'#dc2626'},{n:'Neutral',c:'#525252'},{n:'Slate',c:'#475569'},{n:'Yellow',c:'#ca8a04'}
];

let data=JSON.parse(localStorage.getItem('mgr3')||'[]');
let cfg=JSON.parse(localStorage.getItem('mgrcfg')||'{"theme":"Pink","auto":true,"dark":false}');
let ei=null,ctype='apple',oc={},sp={};

function sd(){localStorage.setItem('mgr3',JSON.stringify(data));}
function sc(){localStorage.setItem('mgrcfg',JSON.stringify(cfg));}

// THEME
function applyTheme(n){cfg.theme=n;document.body.setAttribute('data-theme',n);sc();renderCG();updDot();}
function updDot(){const t=THEMES.find(t=>t.n===cfg.theme)||THEMES[2];document.getElementById('curDot').style.background=t.c;}
function renderCG(){
  const g=document.getElementById('cgrid');
  g.innerHTML=THEMES.map(t=>`<div class="cc${cfg.theme===t.n?' sel':''}" style="background:${t.c}" title="${t.n}" onclick="applyTheme('${t.n}')"><div class="cc-ring"></div>${t.n}</div>`).join('');
}
function toggleCGrid(){
  const w=document.getElementById('cgWrap'),c=document.getElementById('cgChev');
  const s=w.style.display==='none';w.style.display=s?'block':'none';
  c.style.transform=s?'rotate(180deg)':'';
}

// DAY/NIGHT
function getBJ(){const n=new Date();return new Date(n.getTime()+n.getTimezoneOffset()*60000+8*3600000);}
function isDay(){const b=getBJ(),m=b.getHours()*60+b.getMinutes();return m>=360&&m<1110;} // 6:00-18:30
function applyMode(dark){document.body.setAttribute('data-mode',dark?'dark':'light');}

function toggleAuto(){
  cfg.auto=!cfg.auto;sc();updSettings();
  if(cfg.auto)applyMode(!isDay());
}
function toggleDark(){
  if(cfg.auto)return;
  cfg.dark=!cfg.dark;sc();applyMode(cfg.dark);updSettings();
}
function updSettings(){
  const auto=cfg.auto,day=isDay();
  document.getElementById('togAuto').classList.toggle('on',auto);
  document.getElementById('togDark').classList.toggle('on',auto?!day:cfg.dark);
  const dr=document.getElementById('darkRow');
  dr.style.opacity=auto?'0.45':'1';dr.style.pointerEvents=auto?'none':'auto';
  const box=document.getElementById('modeInfoBox'),txt=document.getElementById('modeInfoTxt');
  if(auto){
    box.style.display='flex';
    txt.textContent=`已根據北京時間自動切換（日出 06:00 / 日落 18:30）。當前為${day?'日間':'夜間'}，顯示${day?'淺色':'深色'}模式。`;
  }else{box.style.display='none';}
}
function tickClock(){
  const b=getBJ(),p=n=>String(n).padStart(2,'0');
  document.getElementById('bjTime').textContent=`${p(b.getHours())}:${p(b.getMinutes())}:${p(b.getSeconds())}`;
  const day=isDay();
  document.getElementById('dnchip').textContent=day?'☀️ 日間':'🌙 夜間';
  if(cfg.auto)applyMode(!day);
  document.getElementById('togDark').classList.toggle('on',cfg.auto?!day:cfg.dark);
}

// PAGES
function goPage(id){
  document.querySelectorAll('.page').forEach(p=>p.classList.remove('on'));
  document.getElementById(id).classList.add('on');
  document.getElementById('tab0').classList.toggle('on',id==='pMain');
  document.getElementById('tab1').classList.toggle('on',id==='pSettings');
  if(id==='pSettings'){renderCG();updDot();updSettings();}
  else render();
}

// RENDER
function render(){
  const q=document.getElementById('srch').value.toLowerCase();
  const al=data.map((a,i)=>({...a,_i:i})).filter(a=>a.t==='a'&&(!q||a.r?.toLowerCase().includes(q)||a.e?.toLowerCase().includes(q)));
  const nl=data.map((a,i)=>({...a,_i:i})).filter(a=>a.t==='n'&&(!q||a.nm?.toLowerCase().includes(q)||a.s?.toLowerCase().includes(q)));
  document.getElementById('badge').textContent=data.length;
  document.getElementById('appleSec').style.display=al.length?'':'none';
  document.getElementById('nodeSec').style.display=nl.length?'':'none';
  document.getElementById('appleList').innerHTML=al.map(a=>appleCard(a)).join('');
  document.getElementById('nodeList').innerHTML=nl.map(a=>nodeCard(a)).join('');
}

function appleCard(a){
  const i=a._i,o=oc[i]?'open':'',sh=sp[i];
  return`<div class="card ${o}" id="c${i}">
  <div class="card-hdr" onclick="toggleC(${i})">
    <div class="card-hdr-l"><span class="cflag">${a.f||'🌐'}</span><div><div class="cname">${eh(a.r||'未命名')}</div><div class="csub">${eh(a.e||'—')}</div></div></div>
    <div class="card-hdr-r"><span class="tbadge a">Apple ID</span><button class="cpbtn" onclick="event.stopPropagation();cpA(${i})">複製</button><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></div>
  </div>
  <div class="cbody">
    <div class="frow"><span class="flbl">帳號</span><span class="fval">${eh(a.e||'—')}</span><div class="facts"><button class="mb" onclick="cp('${ea(a.e)}','帳號已複製')">${iCopy()}</button></div></div>
    <div class="frow"><span class="flbl">密碼</span><span class="fval ${sh?'':'mask'}">${sh?eh(a.p||''):'••••••••'}</span><div class="facts"><button class="mb" onclick="toggleS(${i})">${sh?iEyeOff():iEye()}</button><button class="mb" onclick="cp('${ea(a.p)}','密碼已複製')">${iCopy()}</button></div></div>
    <div class="cerow"><div class="erb"><button class="rbtn" onclick="openEdit(${i})">${iEdit()} 編輯</button><button class="rbtn del" onclick="delItem(${i})">${iTrsh()} 刪除</button></div></div>
  </div></div>`;
}

function nodeCard(a){
  const i=a._i,o=oc[i]?'open':'',sh=sp[i];
  return`<div class="card ${o}" id="c${i}">
  <div class="card-hdr" onclick="toggleC(${i})">
    <div class="card-hdr-l"><span class="cflag">${a.f||'🌐'}</span><div><div class="cname">${eh(a.nm||'未命名節點')}</div><div class="csub">${eh(a.s||'—')}${a.po?':'+a.po:''}</div></div></div>
    <div class="card-hdr-r"><span class="tbadge n">節點</span><button class="cpbtn" onclick="event.stopPropagation();cpN(${i})">複製</button><svg class="chev" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="6 9 12 15 18 9"/></svg></div>
  </div>
  <div class="cbody">
    ${a.s?`<div class="frow"><span class="flbl">伺服器</span><span class="fval">${eh(a.s)}</span><div class="facts"><button class="mb" onclick="cp('${ea(a.s)}','已複製')">${iCopy()}</button></div></div>`:''}
    ${a.po?`<div class="frow"><span class="flbl">端口</span><span class="fval">${eh(a.po)}</span><div class="facts"><button class="mb" onclick="cp('${ea(a.po)}','已複製')">${iCopy()}</button></div></div>`:''}
    ${a.pr?`<div class="frow"><span class="flbl">協議</span><span class="fval">${eh(a.pr)}</span></div>`:''}
    ${a.u?`<div class="frow"><span class="flbl">UUID</span><span class="fval ${sh?'':'mask'}">${sh?eh(a.u):'••••••••••••'}</span><div class="facts"><button class="mb" onclick="toggleS(${i})">${sh?iEyeOff():iEye()}</button><button class="mb" onclick="cp('${ea(a.u)}','UUID已複製')">${iCopy()}</button></div></div>`:''}
    ${a.no?`<div class="frow"><span class="flbl">備註</span><span class="fval" style="font-size:11px;letter-spacing:0;font-family:inherit">${eh(a.no)}</span><div class="facts"><button class="mb" onclick="cp('${ea(a.no)}','已複製')">${iCopy()}</button></div></div>`:''}
    <div class="cerow"><div class="erb"><button class="rbtn" onclick="openEdit(${i})">${iEdit()} 編輯</button><button class="rbtn del" onclick="delItem(${i})">${iTrsh()} 刪除</button></div></div>
  </div></div>`;
}

function toggleC(i){oc[i]=!oc[i];render();}
function toggleS(i){sp[i]=!sp[i];render();}

function cpA(i){const a=data[i];navigator.clipboard.writeText(`地區：${a.r}\n帳號：${a.e}\n密碼：${a.p}`).then(()=>toast('帳號資訊已複製'));}
function cpN(i){const a=data[i];let t=`節點：${a.nm}\n伺服器：${a.s}:${a.po}\n協議：${a.pr}`;if(a.u)t+=`\nUUID：${a.u}`;if(a.no)t+=`\n備註：${a.no}`;navigator.clipboard.writeText(t).then(()=>toast('節點資訊已複製'));}
function cp(v,m){navigator.clipboard.writeText(v).then(()=>toast(m||'已複製'));}

function delItem(i){
  const nm=data[i].r||data[i].nm||'此項目';
  if(!confirm(`確定刪除「${nm}」嗎？`))return;
  data.splice(i,1);sd();render();toast('已刪除');
}

// MODAL
function openAdd(){
  ei=null;selType('apple');clearF();
  document.getElementById('mtitle').textContent='新增';
  document.getElementById('macts').innerHTML=`<button class="bcnl" onclick="closeM()">取消</button><button class="bsave" onclick="saveItem()">儲存</button>`;
  document.getElementById('moverlay').classList.add('on');
}
function openEdit(i){
  ei=i;const a=data[i];
  document.getElementById('mtitle').textContent='編輯';
  selType(a.t==='a'?'apple':'node');
  if(a.t==='a'){
    document.getElementById('fReg').value=a.r||'';document.getElementById('fFlg').value=a.f||'';
    document.getElementById('fEml').value=a.e||'';document.getElementById('fPw').value=a.p||'';
  }else{
    document.getElementById('fNN').value=a.nm||'';document.getElementById('fNF').value=a.f||'';
    document.getElementById('fNS').value=a.s||'';document.getElementById('fNP').value=a.po||'';
    document.getElementById('fNPr').value=a.pr||'';document.getElementById('fNU').value=a.u||'';
    document.getElementById('fNNote').value=a.no||'';
  }
  document.getElementById('macts').innerHTML=`<button class="bdel" onclick="delItem(${i});closeM()">刪除</button><button class="bcnl" onclick="closeM()">取消</button><button class="bsave" onclick="saveItem()">儲存</button>`;
  document.getElementById('moverlay').classList.add('on');
}
function closeM(){document.getElementById('moverlay').classList.remove('on');}
function clearF(){['fReg','fFlg','fEml','fPw','fNN','fNF','fNS','fNP','fNPr','fNU','fNNote'].forEach(id=>{const e=document.getElementById(id);if(e)e.value='';});}
function selType(t){
  ctype=t;
  document.getElementById('btnA').classList.toggle('on',t==='apple');
  document.getElementById('btnN').classList.toggle('on',t==='node');
  document.getElementById('aff').classList.toggle('on',t==='apple');
  document.getElementById('nff').classList.toggle('on',t==='node');
}
function saveItem(){
  if(ctype==='apple'){
    const r=document.getElementById('fReg').value.trim(),f=document.getElementById('fFlg').value.trim(),e=document.getElementById('fEml').value.trim(),p=document.getElementById('fPw').value.trim();
    if(!r){toast('請輸入地區名稱');return;}if(!e){toast('請輸入 Apple ID');return;}
    const d={t:'a',r,f,e,p};
    ei!==null?data[ei]=d:data.push(d);
  }else{
    const nm=document.getElementById('fNN').value.trim(),f=document.getElementById('fNF').value.trim(),s=document.getElementById('fNS').value.trim(),po=document.getElementById('fNP').value.trim(),pr=document.getElementById('fNPr').value.trim(),u=document.getElementById('fNU').value.trim(),no=document.getElementById('fNNote').value.trim();
    if(!nm){toast('請輸入節點名稱');return;}
    const d={t:'n',nm,f,s,po,pr,u,no};
    ei!==null?data[ei]=d:data.push(d);
  }
  sd();closeM();render();toast(ei!==null?'已更新':'已新增');
}
document.getElementById('moverlay').addEventListener('click',e=>{if(e.target===document.getElementById('moverlay'))closeM();});

// TOAST
function toast(m){const t=document.getElementById('toast');t.textContent=m;t.classList.add('on');setTimeout(()=>t.classList.remove('on'),2000);}

// ICONS
function iCopy(){return`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>`;}
function iEye(){return`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>`;}
function iEyeOff(){return`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/><line x1="1" y1="1" x2="23" y2="23"/></svg>`;}
function iEdit(){return`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>`;}
function iTrsh(){return`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" width="12" height="12"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14H6L5 6"/><path d="M10 11v6M14 11v6M9 6V4h6v2"/></svg>`;}
function eh(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}
function ea(s){return String(s||'').replace(/'/g,"\\'").replace(/\n/g,' ');}

// INIT
applyTheme(cfg.theme||'Pink');
if(cfg.auto)applyMode(!isDay()); else applyMode(cfg.dark);
tickClock();setInterval(tickClock,1000);
render();
</script>

</body>
</html>
